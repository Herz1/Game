name: Build and preserve Lantern Tides
on:
  push:
    branches: [main]
    paths-ignore: ['build/**', 'archive/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lantern-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: |
            *.md
            *.json
            LICENSE
            src/**
            tools/**
            tests/**
            assets/**
            docs/**
            design/**
            data/**
            archive/**
            build/**
            .github/workflows/*.yml
            !.git/**
            !node_modules/**
            !**/.env*
          include-hidden-files: false
          retention-days: 90
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install compiler
        if: ${{ hashFiles('package.json') != '' }}
        run: npm install --ignore-scripts
      - name: Verify and build
        if: ${{ hashFiles('src/app.ts') != '' && hashFiles('tests/run.cjs') != '' }}
        run: npm run verify
      - name: Preserve release and QA
        if: ${{ hashFiles('build/release/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lantern-tides-release
          path: |
            build
            src
            data
            tools
            tests
            assets
            docs
            package*.json
            tsconfig.json
          retention-days: 90
      - name: Commit verified release
        if: ${{ hashFiles('build/release/index.html') != '' && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name 'Lantern Tides Build'
          git config user.email 'lantern-build@users.noreply.github.com'
          git add build package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'build: preserve verified standalone HTML and QA [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
