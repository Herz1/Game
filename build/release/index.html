        { id: 0, name: '澪', full: '澪 · 汐见', job: '听潮士', age: 24, color: '#45999b', hair: '#24364b', element: 'pierce', hp: 116, mp: 38, atk: 20, mag: 23, def: 12, speed: 19, intro: '她能听见海，却再也想不起母亲的声音。', need: '取回母亲最后一次出航的航线。', prologue: ['海没有声音。不是风停了，是整片港湾忘了怎样涨潮。', '我的罗盘还指着母亲的船。可船坞的账本说，那艘船从来没有存在过。', '老守港人给了我一枚断裂的潮铃：去看看其他七座灯塔。失去声音的，不只这片海。'], resolve: ['灯塔底下没有沉船，只有一卷以母亲的记忆制成的灯芯。', '我记起了她的歌。还有她临走时没说完的话：不要把怀念，当成活下去的全部。', '这一次，由我替她驶向没有航线的地方。'], bond: '罗温替她修好了罗盘。她终于问他：你也是在找一个回不来的人吗？' },
        { id: 1, name: '罗温', full: '罗温 · 烬枝', job: '誓垣卫', age: 32, color: '#b97a53', hair: '#643d32', element: 'blade', hp: 151, mp: 28, atk: 27, mag: 13, def: 19, speed: 12, intro: '守了一生的关隘，正在遗忘他曾保护的人。', need: '找出那份从未签过的撤防命令。', prologue: ['我守过这道关十八年。每一道裂缝，我都认得。', '昨天，阵亡名册突然空白了。人们庆祝从未发生过的和平，只有我还梦见那场火。', '命令盖着守明院的印。我要带着这份空白名册，问清楚谁有权替死者沉默。'], resolve: ['命令确实是我签的。那一夜，我求灯塔带走了所有人关于战败的记忆。', '我不是为了关隘。我只是受不了自己活下来。', '我会把名字一个一个刻回石头。守护，不是让痛苦从未发生。'], bond: '祈禾给他的旧伤换药，没有问勋章。罗温第一次睡了一个不做梦的夜。' },
        { id: 2, name: '赛拉', full: '赛拉 · 镜隙', job: '星页师', age: 27, color: '#d5ad85', hair: '#994e3f', element: 'fire', hp: 98, mp: 53, atk: 14, mag: 32, def: 10, speed: 16, intro: '她的论文证明，一座城市被从历史中删去了。', need: '寻找导师留下的第零卷书。', prologue: ['馆藏索引从第一卷开始。可是所有脚注，都引用着第零卷。', '导师消失后，人们说他从未在这座学院任教。只有我掌心还留着他教写字时的墨。', '不被记录的事，不等于没有发生。我要沿着那些被划掉的字，一直查到灯塔。'], resolve: ['第零卷不是书，而是守明院每年清除记忆的账册。导师把自己也写了进去。', '他用自己的名字，换回了一城孩子关于家人的记忆。', '我要出版这本书。第一页不写我的名字，写所有被抹去的名字。'], bond: '维恩偷走了她的稿纸，又在第二天归还。纸角多了一张真正的暗道地图。' },
        { id: 3, name: '祈禾', full: '祈禾 · 南枝', job: '芽灯医', age: 25, color: '#86a582', hair: '#344c40', element: 'blunt', hp: 121, mp: 47, atk: 17, mag: 27, def: 14, speed: 14, intro: '能治愈伤口的药，为什么让人忘记疼痛的原因？', need: '追查村中失去记忆的病症。', prologue: ['村里的药越来越灵了。疼痛消退，悲伤也跟着消退。', '奶奶治好了腿，却忘记了教我认药的那条山路。她叫我大夫，不再叫我的小名。', '药根正朝着灯塔生长。我带上最后一株没有发光的种子，决定顺着根走。'], resolve: ['药根吸收的不是月光，是地下流过的记忆。所谓灵药，正在把病人的人生抽空。', '我拔去了第一株药，也亲手放弃了奶奶恢复青春的可能。', '她握着我的手，叫了我的小名。我们慢慢走回家。'], bond: '诺娅说，歌也不是为了让人不再难过。祈禾把这句话写在药箱的里面。' },
        { id: 4, name: '维恩', full: '维恩 · 无月', job: '隙影客', age: 22, color: '#a18abc', hair: '#d8d7db', element: 'shade', hp: 108, mp: 36, atk: 25, mag: 20, def: 10, speed: 26, intro: '偷过无数宝物的他，买不起自己的真名。', need: '从记忆交易所取回一张旧契约。', prologue: ['在无月埠，名字是可以抵押的。我十岁那年，把自己的名字卖了。', '债主说，我早就把它赎回去了。可那个签名，和灯塔长的笔迹一模一样。', '既然账算不清，我就亲自去金库。不是偷东西。这次只是拿回属于我的东西。'], resolve: ['契约上写着我的名字，也写着一个被我忘记的妹妹。她替我赎了债，代价是我永远记不起她。', '我拿走了契约，却没有再偷走任何人的悲伤。', '从今以后，我会带着她的名字活。即使还不知道她长什么样。'], bond: '赛拉没问他会不会读字，只把地图推到两人中间。这让维恩觉得，自己也能有一张书桌。' },
        { id: 5, name: '诺娅', full: '诺娅 · 弦湾', job: '回声歌者', age: 29, color: '#829dbe', hair: '#ccb17a', element: 'light', hp: 111, mp: 49, atk: 15, mag: 28, def: 12, speed: 18, intro: '没有人记得那首歌，却人人都会唱最后一句。', need: '拼回被删去的送潮曲。', prologue: ['金弦湾一年一度的送潮节，已经一百年没有送走过潮水了。', '我的老师说，歌总少一节。他去世以后，连少了什么都没人记得。', '我把最后一句唱给海听。远处有七道光，一起回答了我。'], resolve: ['最后一节不是赞美灯塔，而是教人如何熄灭灯塔。老师一直在等一个肯听的人。', '我不再把它唱得漂亮。我把每个停顿、每次颤抖，都唱了出来。', '人们终于哭了。第二天，港口迎来了很多年来第一场退潮。'], bond: '伊瑟听完歌，只说了一句：下次唱慢一些。我想记住。' },
        { id: 6, name: '朔', full: '朔 · 沙星', job: '铸星匠', age: 36, color: '#bda36c', hair: '#3e3b36', element: 'blunt', hp: 134, mp: 34, atk: 25, mag: 22, def: 17, speed: 13, intro: '他造出了永不停止的机器，却不知道燃料是什么。', need: '查清自家灯炉的能源来源。', prologue: ['我造的炉子从不熄火。沙星驿的人因此再也不必在冬夜挨冻。', '可昨天，徒弟问我他的父亲叫什么。我这才发现，整条街都回答不出来。', '炉子没有吃煤。有人把别的东西送进了燃料管。我必须先把自己的作品拆开。'], resolve: ['设计图上有一道我亲手删去的阀门。它本该让人们知道，每一夜温暖的代价。', '我一直说，机器不应该让人操心。原来我只是替所有人关上了选择的门。', '新炉子烧木头，也会熄火。开关留在每一个使用它的人手里。'], bond: '澪不会修机器，却坚持要把每一颗拆下的螺丝排好。朔说，这是很好的开始。' },
        { id: 7, name: '伊瑟', full: '伊瑟 · 白棘', job: '霜径猎人', age: 26, color: '#8bafbd', hair: '#c4d4dc', element: 'pierce', hp: 119, mp: 35, atk: 28, mag: 18, def: 13, speed: 23, intro: '她追踪雪地里的一串脚印，脚印的主人却是自己。', need: '寻找失踪的守林队。', prologue: ['每一场雪以后，林地里都会出现八个人的脚印。村民说，这里从来只有我一个守林人。', '我在旧营地找到一只手套。内侧缝着我的名字，针脚却不是我的。', '如果忘记能让人平安，我宁可带着危险去找他们。'], resolve: ['队友们自愿成为了灯芯，阻止白棘原被冰潮吞没。他们请求灯塔，让我忘记。', '我不会责怪他们。但这一次，不能再由留下的人替离开的人决定。', '我把八双手套挂在树枝上。春天来的时候，它们一起动了。'], bond: '诺娅从不问她为什么不唱。某个雪夜，伊瑟终于轻轻跟上了最后一句。' }

                this.menuShell('技艺 · 让旅途留下力量', `<div class="two-cols">${this.rosterList()}<section><div class="gold">${hd.job} · Lv.${h.level} · 研习 ${h.jp}</div><p class="small muted">行动技艺消耗灵息，涌势可强化命中与效果。被动技艺学会后常驻，无需另行装配。</p><div class="skill-grid">${LT.SKILLS.filter(sk => sk.owner === h.id).map(sk => { const known = h.learned.includes(sk.id); return btn('learn', `<span class="cost">${known ? '已习得' : `Lv.${sk.level} · ${sk.jp} JP`}</span><h4>${sk.name}${sk.passive ? ' · 被动' : ''}</h4><p>${LT.skillText(sk)}</p>`, sk.id, `skill-box ${known ? 'learned' : ''}`, known || h.level < sk.level || h.jp < sk.jp); }).join('')}</div></section></div>`);
                return;
            }
            if (this.menu === 'inventory') {
                this.menuShell('物品 · 旅人的行囊', `<div class="two-cols">${this.rosterList()}<section><h3 class="section-title">使用对象：${hd.name}　HP ${h.hp}/${LT.stats(h).hp}　SP ${h.mp}/${LT.stats(h).mp}</h3><p class="small muted">物品不会在无效目标上消耗。营具回复整支队伍，只能在战斗外使用。</p><div class="item-list">${LT.ITEMS.filter(it => it.kind === 'consumable' && (this.state.bag[it.id] || 0) > 0).map(it => btn('use', `<div>${it.name}<div class="desc">${it.text}</div></div><span class="price">×${this.state.bag[it.id]}　使用</span>`, it.id, 'item-row')).join('') || '<p class="detail-copy">行囊中没有消耗品。可以前往商会补给，或在旅舍休息。</p>'}</div></section></div>`);
                return;
            }
            if (this.menu === 'shop') {
                const tier = LT.clamp(Math.floor(this.state.bells.length / 1.5), 0, 5), r = Math.min(this.state.region, 7);
                const stock = this.shopMode === 'buy' ? LT.ITEMS.filter(it => it.kind === 'consumable' || it.tier <= tier && (it.kind !== 'weapon' || it.job === r || this.state.roster.some(v => v.id === it.job))) : LT.ITEMS.filter(it => (this.state.bag[it.id] || 0) > 0);
                this.menuShell('旅人商会 · ' + LT.REGIONS[r].name, `<div class="two-cols"><aside class="pane"><h3>◈ ${this.state.gold}</h3><p class="small muted">潮币</p><div class="rule"></div>${btn('shop-mode', '购买', 'buy', this.shopMode === 'buy' ? 'primary' : 'secondary')}<br><br>${btn('shop-mode', '出售', 'sell', this.shopMode === 'sell' ? 'primary' : 'secondary')}<p class="small muted">商会随潮铃进度增加货物。当前可购买至 ${['旅人', '潮铜', '银枝', '月镜', '辉星', '归潮'][tier]}品级。<br>出售价格为原价的 40%，已穿戴的装备不会被出售。</p></aside><section class="item-list">${stock.map(it => btn(this.shopMode === 'buy' ? 'buy' : 'sell', `<div>${it.name}<div class="desc">${it.kind === 'consumable' ? it.text : this.itemStats(it) + ' · ' + it.text}</div></div><span class="price">${this.shopMode === 'buy' ? it.price : Math.floor(it.price * .4)} ◈　${this.shopMode === 'buy' ? '购买' : '出售 ×' + this.state.bag[it.id]}</span>`, it.id, 'item-row', this.shopMode === 'buy' && this.state.gold < it.price)).join('') || '<p class="detail-copy">没有可出售的物品。</p>'}</section></div>`);
                return;
            }
            if (this.menu === 'map') {
                this.renderMap();
                return;
            }
            if (this.menu === 'journal') {
                this.renderJournal();
                return;
            }
            if (this.menu === 'bestiary') {
                this.renderBestiary();
                return;
            }
            if (this.menu === 'save') {
                this.menuShell('记录 · 把旅途留在灯下', `<div class="save-list">${[0, 1, 2, 3].map(slot => `<div class="save-row"><div><h3>${slot === 0 ? '自动记录' : '旅途记录 ' + slot}</h3><p>${esc(this.store.summary(slot))}</p></div><div class="actions">${slot > 0 && this.returnScreen !== 'title' ? btn('save', '写入', String(slot), 'secondary tiny') : ''}${btn('load', '读取', String(slot), 'primary tiny')}</div></div>`).join('')}<div class="small muted">存档保存在此浏览器的本地存储中；清理站点数据会删除它。建议导出独立备份，尤其是通过本地文件打开时。${this.storageAvailable ? '' : '<strong class="gold">当前浏览器无法持久保存，务必导出。</strong>'}</div><div>${this.returnScreen !== 'title' ? btn('export', '导出备份', '', 'secondary tiny') + '　' : ''}${btn('import', '导入备份', '', 'secondary tiny')}</div></div>`);
                return;
            }
            if (this.menu === 'settings') {
                const s = this.state.settings;
                const slider = (key, name, explain, min, max, step) => `<div class="setting"><div><label for="set-${key}">${name}</label><div class="explain">${explain}</div></div><div><input id="set-${key}" type="range" min="${min}" max="${max}" step="${step}" value="${s[key]}" data-setting="${key}"> <span id="value-${key}" class="small gold">${key === 'music' || key === 'sfx' ? Math.round(s[key] * 100) + '%' : s[key]}</span></div></div>`;
                this.menuShell('设置 · 按自己的步调', `<div class="settings-grid">${slider('music', '音乐', '原创分层乐曲与地域环境声', 0, 1, .05)}${slider('sfx', '音效', '脚步、交互、战斗与潮铃', 0, 1, .05)}${slider('speed', '战斗节奏', '影响行动之间的停顿，不改变数值', .5, 3, .5)}${slider('textSpeed', '文字速度', '每秒显现字符；确认键立即显示整句', 8, 120, 8)}<div class="setting"><div><label for="difficulty">旅途难度</label><div class="explain">在下一次战斗生效。所有模式均保留弱点、破势与涌势系统。</div></div><select id="difficulty" data-setting="difficulty">${['story', 'normal', 'hard'].map((v, i) => `<option value="${v}" ${s.difficulty === v ? 'selected' : ''}>${['听故事 · 轻松', '行旅者 · 标准', '守灯人 · 困难'][i]}</option>`).join('')}</select></div><div class="setting"><div><label for="shake">战斗震动</label><div class="explain">关闭后仍保留伤害数字与状态提示</div></div><input id="shake" type="checkbox" data-setting="shake" ${s.shake ? 'checked' : ''}></div><div class="setting"><div><label for="quality">丰富气氛效果</label><div class="explain">光束与更多粒子；低性能设备可关闭</div></div><input id="quality" type="checkbox" data-setting="quality" ${s.quality ? 'checked' : ''}></div></div>`);
                return;
            }
        }
        itemStats(it) { return [['atk', '攻'], ['mag', '术'], ['def', '防'], ['hp', '生命'], ['mp', '灵息'], ['speed', '速']].filter(([k]) => it[k] !== 0).map(([k, label]) => label + (it[k] > 0 ? '+' : '') + it[k]).join('　') + (it.element ? '　' + LT.ELEMENT_NAME[it.element] + '系' : ''); }
        renderMap() {
            const positions = [[140, 302], [91, 153], [272, 72], [472, 90], [678, 169], [683, 319], [489, 388], [282, 362]], r = this.selectedRegion;
            const path = positions.map(([x, y]) => `${x},${y}`).join(' ');
            const node = r < 8 ? LT.REGIONS[r] : null;
            const atlas = `<div class="atlas"><svg viewBox="0 0 815 442" aria-hidden="true"><defs><radialGradient id="sea"><stop stop-color="#385d60"/><stop offset="1" stop-color="#112d38"/></radialGradient></defs><rect width="815" height="442" fill="url(#sea)"/><path d="M25 164 Q 85 10 310 15 T 717 109 Q 813 235 725 377 Q 560 445 320 417 Q 80 421 25 164" fill="none" stroke="#809481" stroke-width="1" opacity=".35"/><polygon points="${path}" fill="none" stroke="#b0a67c" stroke-dasharray="4 7" opacity=".48"/><circle cx="396" cy="232" r="69" fill="none" stroke="#9ca988" opacity=".24"/><circle cx="396" cy="232" r="58" fill="none" stroke="#9ca988" opacity=".2"/><path d="M396 161V304M326 232H466" stroke="#9ca988" opacity=".15"/><text x="396" y="224" text-anchor="middle" fill="#acbca8" font-size="13" letter-spacing="6">不再涨潮的海</text><text x="396" y="246" text-anchor="middle" fill="#788f88" font-size="10" letter-spacing="3">THE STILL SEA</text></svg>${LT.REGIONS.map((reg, i) => `<button class="atlas-node ${this.state.visited.includes(i) ? '' : 'unknown'} ${r === i ? 'selected' : ''}" style="left:${positions[i][0]}px;top:${positions[i][1]}px" data-a="map-select" data-id="${i}">${reg.name}${this.state.bells.includes(i) ? '<span class="bell">◆</span>' : ''}<small>${this.state.visited.includes(i) ? this.state.region === i ? '目前所在' : '已到访' : '尚未到访'}</small></button>`).join('')}</div>`;
            this.menuShell('舆图 · 八条抵达同一片海的路', `<div style="display:grid;grid-template-columns:815px 1fr;gap:25px">${atlas}<aside class="pane atlas-info"><div class="eyebrow">${node ? 'REGION ' + (r + 1) : 'THE EIGHTH LIGHT'}</div><h3 style="margin-top:18px">${node?.name || '静潮中枢'}</h3><p>${node?.subtitle || '八枚潮铃，共同指向的地方。'}</p><div class="rule"></div><div>${node ? node.road + '<br>' + node.dungeon : ''}</div><p class="small muted">${this.state.visited.includes(r) ? '可以通过归灯路线快速返回此城。' : '从相邻地区的野外道路继续前进，亲自到访后解锁快速旅行。'}</p>${btn('fast-travel', '返回此城', String(r), 'primary tiny', !this.state.visited.includes(r))}<div class="rule"></div><p class="small gold">已唤醒潮铃 ${this.state.bells.length}/8<br>旧灯碎片 ${this.state.relics.length}/4</p><p class="small muted">八枚潮铃齐备后，在城镇的归潮船前往最终区域。</p></aside></div>`);
        }
        renderJournal() {
            let body = '';
            const nav = `<nav class="tabs">${[['main', '主线'], ['active', '进行中'], ['complete', '已完成'], ['glossary', '世界词典']].map(([id, name]) => btn('journal-tab', name, id, this.journalTab === id ? 'active' : '')).join('')}</nav>`;
            if (this.journalTab === 'main') {
                const current = Math.min(4, Math.floor(this.state.bells.length / 2));
                body = `<div class="two-cols"><aside class="pane"><h3>潮铃 ${this.state.bells.length}/8</h3><p class="small muted">${this.objective()}</p><div class="rule"></div>${LT.REGIONS.map(r => `<p class="small ${this.state.bells.includes(r.id) ? 'gold' : 'muted'}">${this.state.bells.includes(r.id) ? '◆' : '◇'} ${r.name} · ${r.motif}</p>`).join('')}</aside><section>${LT.ACTS.map((a, i) => `<div class="pane" style="margin-bottom:13px;opacity:${i <= current ? 1 : .45}"><div class="eyebrow">ACT ${i + 1}</div><h3 style="margin-top:9px">${a[0]}</h3><p class="detail-copy">${i <= current ? a[1] : '旅途还没有走到这里。'}</p></div>`).join('')}</section></div>`;
            }
            else if (this.journalTab === 'glossary')
                body = LT.GLOSSARY.map(([title, text]) => `<section class="pane" style="margin-bottom:12px"><h3>${title}</h3><p class="detail-copy">${text}</p></section>`).join('');
            else {
                const list = LT.QUESTS.filter(q => this.journalTab === 'complete' ? this.state.completed.includes(q.id) : this.state.accepted.includes(q.id) && !this.state.completed.includes(q.id));
                const q = list.find(v => v.id === this.selectedQuest) || list[0];
                body = `<div class="two-cols"><aside>${list.map(v => btn('quest-view', `${v.name}<span class="small gold">${this.state.completed.includes(v.id) ? '已结' : LT.questReady(this.state, v) ? '可交付' : ''}</span>`, v.id, 'journal-row ' + (q?.id === v.id ? 'selected' : ''))).join('') || '<p class="detail-copy">这里还没有记录。各地居民会向你讲述他们的故事。</p>'}</aside><section>${q ? `<div class="pane"><div class="eyebrow">${LT.REGIONS[q.region].name}</div><h3 style="margin-top:15px">${q.name}</h3><p class="gold small">${q.npc}</p><p class="detail-copy">${q.request}</p><div class="rule"></div><p class="detail-copy">${this.state.completed.includes(q.id) ? q.resolution : q.objective}</p><p class="small gold">${this.state.completed.includes(q.id) ? '这段故事已被记住。' : `报酬 ${q.reward} 潮币 · 芽灯茶 ×2 · 经验与研习`}</p>${this.state.flags['followup:' + q.id] ? `<p class="small muted">${q.late}</p>` : ''}</div>` : ''}</section></div>`;
            }
            this.menuShell('手记 · 不让任何名字被遗忘', nav + body);
        }
        renderBestiary() {
            const list = LT.ENEMIES.filter(d => this.state.bestiary[d.id]);
            const selected = list.find(d => d.id === this.selectedEnemy) || list[0];
            const card = (d) => btn('bestiary', `<img alt="" src="${LT.monster(d).toDataURL()}"><span>${d.name}</span>`, d.id, 'bestiary-card');
            this.menuShell('异兽志 · 先理解，再挥剑', `<div style="display:grid;grid-template-columns:1fr 310px;gap:25px"><section><p class="small muted">已记录 ${list.length}/${LT.ENEMIES.length} 种。实际遭遇与发现的弱点会永久保留。</p><div class="bestiary-grid">${list.map(card).join('') || '<p class="detail-copy">踏上野外道路后，旅途中遇见的生灵会被记在这里。</p>'}</div></section><aside>${selected ? `<section class="pane"><img src="${LT.monster(selected).toDataURL()}" alt="${selected.name}" style="width:240px;height:240px;object-fit:contain;image-rendering:pixelated"><h3>${selected.name}</h3><p class="detail-copy small">${selected.description}</p><p class="small gold">${selected.pattern}</p><div class="rule"></div><p class="small">已知弱点：${this.state.bestiary[selected.id].weak.map(e => LT.ELEMENT_NAME[e]).join('、') || '尚未发现'}</p><p class="small muted">遭遇 ${this.state.bestiary[selected.id].seen} 次 · 击退 ${this.state.bestiary[selected.id].kills} 次</p></section>` : ''}</aside></div>`);
        }
        renderBattle() {
            const b = this.battle;
            if (!b || this.mode !== 'battle')
                return;
            this.hud.innerHTML = '';
            const a = b.actor(), ready = b.phase === 'choose' && this.combatWait <= 0 && a?.team === 'hero';
            this.boost = Math.min(this.boost, a?.focus || 0);
            const pendingSkill = this.pending?.type === 'skill' ? LT.skillById(this.pending.id || '') : null;
            const friendly = this.pending?.type === 'item' || !!pendingSkill && ['heal', 'revive', 'shield', 'buff', 'cleanse'].includes(pendingSkill.effect);
            const enemyPanels = b.actors.filter(t => t.team === 'enemy' && t.hp > 0).map(t => { const p = this.renderer.battlePosition(t, b), size = LT.enemyById(t.enemyId).boss ? 230 : 160; const known = this.state.bestiary[t.enemyId].weak; return `<button class="enemy-panel ${this.pending && !friendly ? 'targeted' : ''}" style="left:${p.x - 100}px;top:${Math.max(78, p.y - size - 57)}px" data-a="target" data-id="${t.key}" ${!ready || !this.pending || friendly ? 'disabled' : ''}><div class="enemy-name">${t.name}</div><div class="bar enemy"><span style="width:${t.hp / t.maxhp * 100}%"></span></div><div class="numbers"><span>HP</span><span>${t.hp} / ${t.maxhp}</span></div><div class="weakness">${t.weak.map(el => `<span class="element" style="color:${known.includes(el) ? LT.ELEMENT_COLOR[el] : '#8c9d98'}">${known.includes(el) ? LT.ELEMENT_NAME[el] : '?'}</span>`).join('')}</div><div class="guard">${t.stagger ? '护势崩解 · 伤害提升' : '◇ 护势 ' + t.guard + ' / ' + t.maxguard}</div><div class="intent ${t.charged ? 'charged' : ''}">${b.intent(t)}</div></button>`; }).join('');
            const turns = [b.current, ...b.queue].filter(key => !!key && b.actor(key)?.hp).slice(0, 7);
            let actions = '<h4>选择行动</h4><p>攻击弱点削减护势。涌势每轮 +1，上限 3。敌人蓄潮时尽快破势，或选择防御。</p>';
            if (!ready)
                actions = '<h4>潮声流转</h4><p>正在执行行动……<br>下一位旅人很快就能作出选择。</p>';
            else if (this.pending) {
                if (pendingSkill?.all)
                    actions = `<h4>${pendingSkill.name}</h4><p>${LT.skillText(pendingSkill)}</p>${btn('all-targets', '确认 · ' + (friendly ? '全体伙伴' : '全体敌人'), '', '')}`;
                else {
                    const item = this.pending.type === 'item' ? LT.itemById(this.pending.id || '') : null;
                    const revive = pendingSkill?.effect === 'revive' || item?.use === 'revive';
                    const targets = b.actors.filter(t => t.team === (friendly ? 'hero' : 'enemy') && (revive ? t.hp === 0 : t.hp > 0));
                    actions = `<h4>${pendingSkill?.name || item?.name || '攻击'} · 选择目标</h4>${targets.map(t => btn('target', `${t.name}<span class="cost">${t.hp}/${t.maxhp}</span>`, t.key, '')).join('') || '<p>当前没有有效目标。按 Esc 取消。</p>'}`;
                }
            }
            else if (this.combatMode === 'skills' && a) {
                const h = LT.hero(this.state, a.heroId);
                actions = '<h4>技艺 · ' + LT.HEROES[h.id].job + '</h4>' + LT.usableSkills(h).map(sk => btn('choose-skill', `${sk.name}<span class="cost">${sk.cost} SP · ${LT.ELEMENT_NAME[sk.element]}</span>`, sk.id, '', a.mp < sk.cost)).join('');
            }
            else if (this.combatMode === 'items')
                actions = '<h4>行囊</h4>' + LT.ITEMS.filter(it => it.kind === 'consumable' && it.use !== 'camp' && (this.state.bag[it.id] || 0) > 0).map(it => btn('choose-item', `${it.name}<span class="cost">×${this.state.bag[it.id]}</span>`, it.id, '')).join('');
            this.ui.innerHTML = `<div class="battle-log"><div class="eyebrow">${b.ids.some(id => LT.enemyById(id).boss) ? 'GUARDIAN OF MEMORY' : 'A CROSSING OF PATHS'}</div>${b.log.slice(-3).map(l => `<div>${esc(l)}</div>`).join('')}</div><div class="turn-strip">${turns.map((key, i) => `<span class="turn ${i === 0 ? 'current' : ''}">${b.actor(key).name}</span>`).join('')}</div><div class="round">ROUND ${String(b.round).padStart(2, '0')}</div>${enemyPanels}<div class="battle-bottom"><div class="battle-party">${b.actors.filter(t => t.team === 'hero').map(t => `<button class="party-card ${t.key === b.current ? 'current' : ''} ${t.hp === 0 ? 'dead' : ''}" data-a="target" data-id="${t.key}" ${!ready || !friendly ? 'disabled' : ''}>${this.partyCard(LT.hero(this.state, t.heroId), t)}</button>`).join('')}</div><section class="command-pane"><div class="small gold" style="margin-bottom:8px">${a?.team === 'hero' ? a.name + ' · ' + LT.HEROES[a.heroId].job : '敌方行动'}</div><div class="command-buttons">${[['attack', '攻击'], ['skills', '技艺'], ['items', '物品'], ['defend', '防御'], ['escape', '撤退']].map(([id, label]) => btn('combat', label, id, this.combatMode === id ? 'selected' : '', !ready || id === 'escape' && b.mandatory)).join('')}</div><div class="boost-control">${btn('boost', '−', '-1', '', !ready || this.boost === 0)}<span>涌势 ${this.boost} / ${a?.focus || 0}</span>${btn('boost', '＋', '1', '', !ready || this.boost >= (a?.focus || 0))}</div></section><section class="action-pane">${actions}</section></div>`;
        }
    }
    LT.Game = Game;
    if (typeof document !== 'undefined') {
        const boot = () => { if (!document.getElementById('game'))
            return; try {
            LT.game = new Game();
        }
        catch (err) {
            const ui = document.getElementById('ui');
            if (ui)
                ui.innerHTML = `<section class="modal"><h2>启动遇到问题</h2><p>${esc(err instanceof Error ? err.message : err)}</p><p>请使用完整的单文件 HTML，并尝试新版桌面浏览器。存档没有被修改。</p></section>`;
            throw err;
        } };
        if (document.readyState === 'loading')
            document.addEventListener('DOMContentLoaded', boot, { once: true });
        else
            boot();
    }
})(LT || (LT = {}));
</script></body></html>
